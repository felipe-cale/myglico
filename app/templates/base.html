<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#167CD9">
    <title>{% block title %}MyGlico MVP{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v=20260414-design-refresh">
</head>
<body class="app-body {% block body_class %}{% endblock %}">
    {% set current_path = request.url.path if request else '/' %}
    <div class="app-backdrop" aria-hidden="true"></div>
    <div class="site-shell">
        <header class="topbar">
            <a href="/" class="brand" aria-label="MyGlico">
                <span class="brand-mark">
                    <img src="{{ url_for('static', path='img/myglico-mark.svg') }}" alt="">
                </span>
                <span class="brand-copy">
                    <strong>MyGlico</strong>
                    <small>Diario glicemico inteligente</small>
                </span>
            </a>
            <nav class="main-nav" aria-label="Navegacao principal">
                <a href="/" class="nav-link {% if current_path == '/' or current_path.startswith('/patients/') %}is-active{% endif %}">Visao geral</a>
                <a href="/semantic" class="nav-link {% if current_path.startswith('/semantic') %}is-active{% endif %}">Semantica</a>
            </nav>
        </header>

        <main class="page-shell">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div class="site-footer__copy">
                <strong>MyGlico MVP</strong>
                <p>Recorte academico do MyGlico com UCI Diabetes, proveniencia e grafo semantico consultavel.</p>
            </div>
            <div class="site-footer__links">
                <a href="/">Dashboard</a>
                <a href="/semantic">SPARQL</a>
                <a href="/health">Status da API</a>
            </div>
        </footer>
    </div>
</body>
</html>
