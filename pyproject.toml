[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myglico-mvp"
version = "0.1.0"
description = "Academic MVP for MyGlico using the UCI Diabetes dataset."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "pymysql>=1.1.1",
    "cryptography>=42.0.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy>=2.0.41",
]

# Everything the FastAPI app's request-time import graph actually needs is in
# `dependencies` above (mirrors requirements.txt, used for the Vercel
# deployment). numpy/pandas/scikit-learn (clustering + anomaly detection),
# alembic (CLI migrations), uvicorn (local/Docker dev server), lxml, requests,
# unlzw3, prov, rdflib, matplotlib, and networkx are only used by the offline
# import/analytics scripts and local tooling (including rendering the PROV-O
# PNG diagrams in scripts/render_provenance_png.py) — install them with
# `pip install ".[full]"` for local dev or Docker (see Dockerfile). Keeping
# them out of the base install is what keeps the deployed Vercel function
# under the platform's function size limit.
[project.optional-dependencies]
full = [
    "alembic>=1.16.0",
    "lxml>=5.4.0",
    "matplotlib>=3.9.0",
    "networkx>=3.3",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "prov>=2.1.1",
    "rdflib>=7.1.4",
    "requests>=2.32.4",
    "scikit-learn>=1.7.0",
    "unlzw3>=0.2.3",
    "uvicorn[standard]>=0.35.0",
]
# Backend integration tests (tests/integration, pytest). Install with
# `pip install ".[test]"`. The browser E2E suite lives in frontend-react and
# uses its own npm toolchain (`npm install` + `npx playwright test`), see
# frontend-react/e2e/README.md.
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: backend integration tests running against an isolated database",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
