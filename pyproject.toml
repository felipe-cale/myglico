[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myglico-mvp"
version = "0.1.0"
description = "Academic MVP for MyGlico using the UCI Diabetes dataset."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.116.0",
    "jinja2>=3.1.6",
    "lxml>=5.4.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "prov>=2.1.1",
    "pydantic-settings>=2.10.0",
    "rdflib>=7.1.4",
    "requests>=2.32.4",
    "scikit-learn>=1.7.0",
    "sqlalchemy>=2.0.41",
    "unlzw3>=0.2.3",
    "uvicorn[standard]>=0.35.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
